name: Hourly collect + build + deploy

on:
  # Cron 트리거는 CF Worker (ryanpp-cron-trigger) 가 workflow_dispatch 로 매시간 fire.
  # GitHub schedule cron 은 트로틀링 이슈 + CF Worker 와 중복 실행되며
  # 원격 push 충돌을 유발하므로 제거함.
  workflow_dispatch:
    inputs:
      skip_collect:
        description: "Skip collector (code-only redeploy)"
        type: boolean
        default: false
      force_daily:
        description: "Force welfare+youth collection this run"
        type: boolean
        default: false
  push:
    branches: [main]
    paths-ignore:
      - "data/**"
      - "**/*.md"

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DATA_GO_KR_API_KEY: ${{ secrets.DATA_GO_KR_API_KEY }}
      WEATHER_API_BASE: https://apis.data.go.kr/1360000/VilageFcstInfoService_2.0
      WELFARE_API_BASE: https://apis.data.go.kr/B554287/NationalWelfareInformationsV001
      YOUTH_API_KEY: ${{ secrets.YOUTH_API_KEY }}
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      NEXT_PUBLIC_GA4_MEASUREMENT_ID: ${{ secrets.NEXT_PUBLIC_GA4_MEASUREMENT_ID }}
      NEXT_PUBLIC_ADSENSE_CLIENT_ID: ${{ secrets.NEXT_PUBLIC_ADSENSE_CLIENT_ID }}
      NEXT_PUBLIC_KAKAO_ADFIT_UNIT_300x250: ${{ secrets.NEXT_PUBLIC_KAKAO_ADFIT_UNIT_300x250 }}
      NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION: ${{ secrets.NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION }}
      NEXT_PUBLIC_NAVER_SITE_VERIFICATION: ${{ secrets.NEXT_PUBLIC_NAVER_SITE_VERIFICATION }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        if: ${{ github.event_name != 'push' && !inputs.skip_collect }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: collector/requirements.txt

      - name: Install collector dependencies
        if: ${{ github.event_name != 'push' && !inputs.skip_collect }}
        run: pip install -r collector/requirements.txt

      - name: Determine schedule mode
        id: mode
        run: |
          HOUR=$(date -u +%H)
          if [ "$HOUR" = "16" ] || [ "${{ inputs.force_daily }}" = "true" ]; then
            RUN_DAILY=true
          else
            RUN_DAILY=false
          fi
          echo "run_daily=$RUN_DAILY" >> $GITHUB_OUTPUT
          echo "UTC hour=$HOUR → run_daily=$RUN_DAILY (daily = UTC 16 = KST 01)"

      - name: Collect — trends (매시간)
        if: ${{ github.event_name != 'push' && !inputs.skip_collect }}
        timeout-minutes: 5
        run: python collector/scripts/fetch_trends.py
        continue-on-error: true

      - name: Collect — weather (매시간, 17 시도 + 250 시군구)
        if: ${{ github.event_name != 'push' && !inputs.skip_collect }}
        timeout-minutes: 10
        run: python collector/scripts/fetch_weather.py
        continue-on-error: true

      - name: Collect — welfare list (하루 1회, 461 서비스)
        if: ${{ github.event_name != 'push' && !inputs.skip_collect && steps.mode.outputs.run_daily == 'true' }}
        timeout-minutes: 5
        run: python collector/scripts/fetch_welfare.py
        continue-on-error: true

      - name: Collect — welfare detail (하루 1회, quota 소진 시 조기 종료)
        if: ${{ github.event_name != 'push' && !inputs.skip_collect && steps.mode.outputs.run_daily == 'true' }}
        timeout-minutes: 30
        run: python collector/scripts/fetch_welfare_detail.py
        continue-on-error: true

      - name: Collect — youth policy (하루 1회, 2,728 정책)
        if: ${{ github.event_name != 'push' && !inputs.skip_collect && steps.mode.outputs.run_daily == 'true' }}
        timeout-minutes: 15
        run: python collector/scripts/fetch_youth.py
        continue-on-error: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        timeout-minutes: 5
        working-directory: web
        run: npm ci

      - name: Build static site
        timeout-minutes: 10
        working-directory: web
        run: npm run build

      # Cloudflare Pages 무료 플랜은 배포당 20,000 파일 한계.
      # Next.js RSC __next*.txt/*.txt 페이로드 (사용 안함)를 제거해 3,520개로 축소.
      - name: Prune RSC payload files (Cloudflare 20K limit)
        working-directory: web/out
        run: find . -type f \( -name '__next*' -o \( -name '*.txt' ! -name 'ads.txt' ! -name 'robots.txt' \) \) -delete

      - name: Deploy to Cloudflare Pages
        timeout-minutes: 5
        working-directory: web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages deploy out --project-name=now-ryanpp --branch=main

      # 앱인토스 미니앱 '우리동네 오늘'용 데이터 서빙 API 재배포.
      # api.ryanpp.com 이 이 프로젝트에 연결돼 있어, data/ 갱신을 앱까지 반영.
      - name: Sync data to hometown-today-api
        if: ${{ github.event_name != 'push' && !inputs.skip_collect }}
        run: python hometown-today-api/scripts/sync_from_data.py

      - name: Deploy hometown-today-api (Worker with static assets)
        if: ${{ github.event_name != 'push' && !inputs.skip_collect }}
        timeout-minutes: 5
        working-directory: hometown-today-api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # wrangler.jsonc 에 assets.directory=public 지정 → wrangler deploy 가 정적 자산 업로드.
        # api.ryanpp.com 커스텀 도메인 연결돼 있어 배포 즉시 반영.
        run: npx --yes wrangler@4.131.0 deploy

      - name: Commit refreshed data
        if: ${{ github.event_name != 'push' && !inputs.skip_collect }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "No data changes to commit."
            exit 0
          fi
          git commit -m "chore(data): auto-refresh $(date -u +%Y-%m-%d) [skip ci]"
          # 원격이 앞서있을 수 있으므로 rebase 후 push. 최대 3회 재시도.
          for attempt in 1 2 3; do
            if git pull --rebase --autostash origin main && git push; then
              echo "Pushed on attempt $attempt"
              exit 0
            fi
            echo "Push attempt $attempt failed; sleeping before retry..."
            sleep 5
          done
          echo "::error::Failed to push data changes after 3 attempts"
          exit 1
