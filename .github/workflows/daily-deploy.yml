name: Daily collect + build + deploy

on:
  schedule:
    # KST 05:00 = UTC 20:00 (전날). 매일 아침 신선한 데이터로 배포.
    - cron: "0 20 * * *"
  workflow_dispatch:
    inputs:
      skip_collect:
        description: "Skip collector (code-only redeploy)"
        type: boolean
        default: false
  push:
    branches: [main]
    paths-ignore:
      - "data/**"
      - "**/*.md"

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DATA_GO_KR_API_KEY: ${{ secrets.DATA_GO_KR_API_KEY }}
      WEATHER_API_BASE: https://apis.data.go.kr/1360000/VilageFcstInfoService_2.0
      WELFARE_API_BASE: https://apis.data.go.kr/B554287/NationalWelfareInformationsV001
      YOUTH_API_KEY: ${{ secrets.YOUTH_API_KEY }}
      NEXT_PUBLIC_GA4_MEASUREMENT_ID: ${{ secrets.NEXT_PUBLIC_GA4_MEASUREMENT_ID }}
      NEXT_PUBLIC_ADSENSE_CLIENT_ID: ${{ secrets.NEXT_PUBLIC_ADSENSE_CLIENT_ID }}
      NEXT_PUBLIC_KAKAO_ADFIT_UNIT_300x250: ${{ secrets.NEXT_PUBLIC_KAKAO_ADFIT_UNIT_300x250 }}
      NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION: ${{ secrets.NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION }}
      NEXT_PUBLIC_NAVER_SITE_VERIFICATION: ${{ secrets.NEXT_PUBLIC_NAVER_SITE_VERIFICATION }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        if: ${{ github.event_name != 'push' && !inputs.skip_collect }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: collector/requirements.txt

      - name: Install collector dependencies
        if: ${{ github.event_name != 'push' && !inputs.skip_collect }}
        run: pip install -r collector/requirements.txt

      - name: Collect — trends (Google News + HN)
        if: ${{ github.event_name != 'push' && !inputs.skip_collect }}
        timeout-minutes: 5
        run: python collector/scripts/fetch_trends.py
        continue-on-error: true

      - name: Collect — weather (17 시도 + 250 시군구)
        if: ${{ github.event_name != 'push' && !inputs.skip_collect }}
        timeout-minutes: 10
        run: python collector/scripts/fetch_weather.py
        continue-on-error: true

      - name: Collect — welfare list (461 서비스)
        if: ${{ github.event_name != 'push' && !inputs.skip_collect }}
        timeout-minutes: 5
        run: python collector/scripts/fetch_welfare.py
        continue-on-error: true

      - name: Collect — welfare detail (rate-limited, capped 8min)
        if: ${{ github.event_name != 'push' && !inputs.skip_collect }}
        timeout-minutes: 9
        # Hard cap via `timeout` so script exits gracefully vs step timeout SIGKILL
        run: timeout --preserve-status 480 python collector/scripts/fetch_welfare_detail.py || true
        continue-on-error: true

      - name: Collect — youth policy (2,728 정책)
        if: ${{ github.event_name != 'push' && !inputs.skip_collect }}
        timeout-minutes: 10
        run: python collector/scripts/fetch_youth.py
        continue-on-error: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        timeout-minutes: 5
        working-directory: web
        run: npm ci

      - name: Build static site
        timeout-minutes: 10
        working-directory: web
        run: npm run build

      - name: Deploy to Cloudflare Pages
        timeout-minutes: 5
        working-directory: web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages deploy out --project-name=now-ryanpp --branch=main

      - name: Commit refreshed data
        if: ${{ github.event_name != 'push' && !inputs.skip_collect }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "chore(data): auto-refresh $(date -u +%Y-%m-%d) [skip ci]"
            git push
          fi
