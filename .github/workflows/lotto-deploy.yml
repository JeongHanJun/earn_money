name: Deploy lotto

on:
  push:
    branches: [main]
    paths:
      - "lotto/**"
      - ".github/workflows/lotto-deploy.yml"
  workflow_dispatch:
    inputs:
      run_bootstrap:
        description: "Run seeds/0002_bootstrap_data.sql (jeong760 → D1, 1242 회차 draws + prizes)"
        type: boolean
        default: false
      backfill_from:
        description: "Backfill winning_stores 시작 회차 (예: 262). 빈 값이면 스킵."
        type: string
      backfill_to:
        description: "Backfill winning_stores 끝 회차 (예: 1242)"
        type: string

permissions:
  contents: read

concurrency:
  group: lotto-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      LOTTO_ADMIN_SECRET: ${{ secrets.LOTTO_ADMIN_SECRET }}
      LOTTO_URL: https://lotto.ryanpp.com

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: lotto/package-lock.json

      - name: Install dependencies
        working-directory: lotto
        run: npm ci

      - name: Apply D1 schema (0001_init.sql, idempotent)
        working-directory: lotto
        run: npx wrangler d1 execute lotto-db --remote --file=migrations/0001_init.sql

      - name: Bootstrap draws (jeong760 → D1)
        if: ${{ inputs.run_bootstrap == 'true' }}
        working-directory: lotto
        timeout-minutes: 10
        run: npx wrangler d1 execute lotto-db --remote --file=seeds/0002_bootstrap_data.sql

      - name: Build frontend
        working-directory: lotto
        run: npm run build

      - name: Deploy Worker + Assets
        working-directory: lotto
        run: npx wrangler deploy

      - name: Set/update Worker secret ADMIN_SECRET
        working-directory: lotto
        run: |
          if [ -z "$LOTTO_ADMIN_SECRET" ]; then
            echo "LOTTO_ADMIN_SECRET GitHub secret 미설정 — admin endpoint 비활성화 상태"
            exit 0
          fi
          echo -n "$LOTTO_ADMIN_SECRET" | npx wrangler secret put ADMIN_SECRET

      - name: Backfill winning_stores (chunked)
        if: ${{ inputs.backfill_from != '' && inputs.backfill_to != '' }}
        env:
          FROM: ${{ inputs.backfill_from }}
          TO: ${{ inputs.backfill_to }}
        run: |
          set -e
          echo "Backfill $FROM ~ $TO (30 회차씩 청크)"
          start=$FROM
          while [ "$start" -le "$TO" ]; do
            end=$((start + 29))
            if [ "$end" -gt "$TO" ]; then end=$TO; fi
            echo "  chunk $start ~ $end"
            for attempt in 1 2 3; do
              code=$(curl -sS -o /tmp/backfill.out -w "%{http_code}" \
                -X POST \
                -H "Authorization: Bearer $LOTTO_ADMIN_SECRET" \
                "$LOTTO_URL/api/admin/backfill?from=$start&to=$end")
              cat /tmp/backfill.out
              echo
              if [ "$code" = "200" ]; then
                break
              fi
              echo "  attempt $attempt failed (HTTP $code), retry in 10s"
              sleep 10
            done
            start=$((end + 1))
            sleep 1
          done
          echo "Backfill 완료"
