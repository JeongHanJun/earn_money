[project]
name = "collector"
version = "0.1.0"
description = "공공데이터 API 수집기 (now.ryanpp)"
requires-python = ">=3.11"
dependencies = [
  "requests>=2.31",
  "python-dotenv>=1.0",
  "pydantic>=2.5",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
