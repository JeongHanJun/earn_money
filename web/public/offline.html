<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>오프라인 · ryanpp</title>
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <style>
      html, body { margin: 0; height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; background: #fafafa; color: #18181b; }
      body { display: flex; align-items: center; justify-content: center; padding: 24px; }
      main { max-width: 420px; text-align: center; }
      .dot { display: inline-block; height: 12px; width: 12px; border-radius: 999px; background: #4f46e5; margin-right: 8px; vertical-align: middle; }
      h1 { font-size: 22px; margin: 0 0 8px; letter-spacing: -0.01em; }
      p { color: #52525b; line-height: 1.6; margin: 0 0 20px; font-size: 15px; }
      button { background: #4f46e5; color: white; border: 0; padding: 12px 24px; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; }
      button:hover { background: #4338ca; }
      .brand { font-weight: 600; letter-spacing: -0.01em; margin-bottom: 24px; }
    </style>
  </head>
  <body>
    <main>
      <div class="brand"><span class="dot" aria-hidden="true"></span>ryanpp</div>
      <h1>오프라인이에요</h1>
      <p>인터넷 연결이 끊긴 것 같아요.<br>이전에 열어본 페이지는 계속 보실 수 있어요.</p>
      <button onclick="location.reload()">다시 시도</button>
    </main>
  </body>
</html>
