name: Deploy lotto

on:
  push:
    branches: [main]
    paths:
      - "lotto/**"
      - ".github/workflows/lotto-deploy.yml"
  workflow_dispatch:
    inputs:
      run_bootstrap:
        description: "Run seeds/0002_bootstrap_data.sql (jeong760 → D1, 1242 회차 draws + prizes)"
        type: boolean
        default: false
      backfill_from:
        description: "Backfill winning_stores 시작 회차 (예: 262). 빈 값이면 스킵."
        type: string
      backfill_to:
        description: "Backfill winning_stores 끝 회차 (예: 1242)"
        type: string

permissions:
  contents: read

concurrency:
  group: lotto-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      LOTTO_ADMIN_SECRET: ${{ secrets.LOTTO_ADMIN_SECRET }}
      LOTTO_URL: https://lotto.ryanpp.com

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: lotto/package-lock.json

      - name: Install dependencies
        working-directory: lotto
        run: npm ci

      - name: Diagnose Cloudflare API token
        run: |
          echo "=== token verify ==="
          curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/user/tokens/verify"
          echo
          echo "=== list D1 databases ==="
          curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database" | head -c 800
          echo
          echo "=== REST API D1 SELECT test (read) ==="
          curl -sS -X POST -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database/c21bdb40-5834-41e7-840d-f6f648f1d24a/query" \
            -d '{"sql":"SELECT 1 AS ok"}'
          echo
          echo "=== REST API D1 CREATE TABLE test (write) ==="
          curl -sS -X POST -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database/c21bdb40-5834-41e7-840d-f6f648f1d24a/query" \
            -d '{"sql":"CREATE TABLE IF NOT EXISTS _ci_test (id INTEGER)"}'
          echo

      - name: Apply D1 schema via REST API (statement by statement)
        run: |
          python3 --version
          python3 lotto/scripts/apply-d1-sql.py lotto/migrations/0001_init.sql
          echo "=== script exit code: $? ==="

      - name: Direct curl D1 sanity write (in case script silently failed)
        if: always()
        run: |
          echo "=== direct curl: CREATE TABLE test2 ==="
          RESP=$(curl -sS -X POST -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database/c21bdb40-5834-41e7-840d-f6f648f1d24a/query" \
            -d '{"sql":"CREATE TABLE IF NOT EXISTS _ci_test2 (id INTEGER)"}')
          echo "$RESP"

      - name: Bootstrap draws (jeong760 → D1)
        if: ${{ inputs.run_bootstrap == 'true' }}
        timeout-minutes: 15
        run: python3 lotto/scripts/apply-d1-sql.py lotto/seeds/0002_bootstrap_data.sql

      - name: Build frontend
        working-directory: lotto
        run: npm run build

      - name: Deploy Worker + Assets
        working-directory: lotto
        run: npx wrangler deploy

      - name: Set/update Worker secret ADMIN_SECRET
        working-directory: lotto
        run: |
          if [ -z "$LOTTO_ADMIN_SECRET" ]; then
            echo "LOTTO_ADMIN_SECRET GitHub secret 미설정 — admin endpoint 비활성화 상태"
            exit 0
          fi
          echo -n "$LOTTO_ADMIN_SECRET" | npx wrangler secret put ADMIN_SECRET

      - name: Backfill winning_stores (chunked)
        if: ${{ inputs.backfill_from != '' && inputs.backfill_to != '' }}
        env:
          FROM: ${{ inputs.backfill_from }}
          TO: ${{ inputs.backfill_to }}
        run: |
          set -e
          echo "Backfill $FROM ~ $TO (30 회차씩 청크)"
          start=$FROM
          while [ "$start" -le "$TO" ]; do
            end=$((start + 29))
            if [ "$end" -gt "$TO" ]; then end=$TO; fi
            echo "  chunk $start ~ $end"
            for attempt in 1 2 3; do
              code=$(curl -sS -o /tmp/backfill.out -w "%{http_code}" \
                -X POST \
                -H "Authorization: Bearer $LOTTO_ADMIN_SECRET" \
                "$LOTTO_URL/api/admin/backfill?from=$start&to=$end")
              cat /tmp/backfill.out
              echo
              if [ "$code" = "200" ]; then
                break
              fi
              echo "  attempt $attempt failed (HTTP $code), retry in 10s"
              sleep 10
            done
            start=$((end + 1))
            sleep 1
          done
          echo "Backfill 완료"
